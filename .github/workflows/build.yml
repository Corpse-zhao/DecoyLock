          # Tweak.x 的启动横幅必须用 %@ + DL_VERSION，不能写死
          twk = io.open('Tweak.x', encoding='utf-8', errors='replace').read()
          if 'DecoyLock %@ 启动' not in twk:
              print("❌ 启动横幅没有用 'DecoyLock %@ 启动' + DL_VERSION 的形式")
