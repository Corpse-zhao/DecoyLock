          litver = re.compile(r'\b\d+\.\d+\.\d+\b')
          for fn in files:
              try:
                  txt = io.open(fn, encoding='utf-8', errors='replace').read()
              except IOError:
                  continue
              for i, line in enumerate(txt.split('\n'), 1):
                  s = line.strip()
                  if s.startswith('//') or s.startswith('#'):
                      continue
                  # 只看「运行时会输出/展示」的行
                  if not re.search(r'DLProbe\(|footerText|CFBundle(Short)?Version|kDLPrefsVersion', line):
