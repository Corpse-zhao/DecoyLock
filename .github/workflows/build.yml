                      print("❌ %s:%d 里出现与 DL_VERSION(%s) 不一致的硬编码版本号 %s"
                            % (fn, i, ver, found))
                      print("   → 这会让日志/面板出现两个版本号，排查时误判「插件没生效」")
                      bad += 1
          if bad:
