name: Build DecoyLock

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          brew install make xz ldid

      - name: Setup Theos (roothide 分支)
        run: |
          export THEOS=$HOME/theos
          # ⚠️ 必须用 roothide/theos：官方 theos 没有 roothide package scheme，
          #    会报 "'roothide' package scheme does not exist"（scheme 模块在 vendor/mod/roothide）
          git clone --recursive https://github.com/roothide/theos.git $THEOS
          # ⚠️ sdks 目录必须一次性建好：先 clone 到临时目录再 sparse-checkout，
          #    不要 `cd $THEOS/sdks && git clone ... .`（目录已存在会 fatal 128）
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/theos/sdks.git $THEOS/sdks-tmp
          cd $THEOS/sdks-tmp
          git sparse-checkout set iPhoneOS14.5.sdk
          mv iPhoneOS14.5.sdk $THEOS/sdks/
          rm -rf $THEOS/sdks-tmp
          ls $THEOS/sdks/
          ls $THEOS/vendor/mod/
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      # ⚠️ 顺序很重要：静态自检必须在「Build package」**之前**。
      #    踩坑记录：v0.1.17 / v0.1.18 两轮 CI 里 Preflight 排在 Build 后面，
      #    结果编译一挂 → Preflight 被 skipped → 看不到自检结论，白等两轮。
      - name: Preflight — 静态自检（拦下「编译过了但钩子是空的 / 会崩的」）
        run: |
          # 这些检查专门拦三类错误：
          #   ① Logos 对不存在的类/方法**不报错** → CI 全绿、装上也毫无反应
          #   ② 通用转发挂钩不做签名校验 → 挂到非对象参数方法上 → 锁屏进安全模式
          #   ③ 自己写的「看着没问题但编译不过」的代码 → CI 挂、白等一轮
          FAIL=0

          echo "--- 检查 1：%hook UIResponder 上的输入方法（%orig 会跳 NULL） ---"
          if grep -nE '^%hook[[:space:]]+UIResponder' Tweak.x; then
            echo "❌ UIResponder 不实现 -insertText:/-deleteBackward（由 UIKeyInput 的实现方提供）"
            FAIL=1
          fi

          echo "--- 检查 2：%hook NSObject（灾难性写法） ---"
          if grep -nE '^%hook[[:space:]]+NSObject[[:space:]]*$' Tweak.x; then
            echo "❌ 对 NSObject %hook 会把方法暴露给进程内所有对象（污染 respondsToSelector:）"
            FAIL=1
          fi

          echo "--- 检查 3：%hook \$ 非法（Logos 没有「钩所有类」语法） ---"
          if grep -nE '^%hook[[:space:]]+\$' Tweak.x; then
            echo "❌ %hook \$ 会去找一个真名叫 '\$' 的类 → objc_getClass 返回 NULL → hook 静默失效。"
            echo "   正确做法：objc_getClassList 枚举 + MSHookMessageEx（见 Tweak.x Hook 组 C）"
            FAIL=1
          fi
          if grep -nE '^- *\([^)]*\) *\$[a-zA-Z_]' Tweak.x; then
            echo "❌ 方法名上的 \$ 前缀不是通配符（\$ 只是 Logos 内部符号分隔符，见 logos.pl:14 sigil）"
            FAIL=1
          fi

          echo "--- 检查 4：iOS SDK 上不可用的符号（跳过注释行） ---"
          # ⚠️ 必须排除注释：本项目注释里大量提到 system() / libproc.h 这些坑，
          #    直接 grep 会误报（实测命中 DLRootListController.m:186 的说明注释）。
          if grep -vE '^[[:space:]]*(//|\*|/\*)' Tweak.x prefs/*.m \
               | grep -nE '(^|[^a-zA-Z_.>])system[[:space:]]*\('; then
            echo "❌ system() 在 iOS SDK 被标记 unavailable，编译必挂"
            FAIL=1
          fi
          if grep -vE '^[[:space:]]*(//|\*|/\*)' Tweak.x prefs/*.m \
               | grep -nE '#[[:space:]]*(import|include)[[:space:]]*<libproc\.h>'; then
            echo "❌ libproc.h 不在 iOS SDK 里，需手动 extern 声明 proc_listpids / proc_name"
            FAIL=1
          fi
          if grep -vE '^[[:space:]]*(//|\*|/\*)' Tweak.x prefs/*.m \
               | grep -nE 'kCALayer(Width|Height)Sizable|arch_get_uname|dispatch_get_current_queue'; then
            echo "❌ 检测到 iOS SDK 不可用 API"
            FAIL=1
          fi

          echo "--- 检查 5：⭐ 通用转发挂钩必须做签名校验（v0.1.7 锁屏进安全模式的根因） ---"
          # 教训：按「方法名子串」筛选 + 通用转发 = 会挂到签名不兼容的方法上。
          # 例如把 BOOL 参数当 id（64 位指针）转发，原实现一解引用就崩。
          # 必须：① 只挂显式白名单（精确匹配）；② 用 method_copyArgumentType
          #        逐个校验参数编码；③ 转发函数体内包 @try。
          if grep -nE 'containsString:@"(unlock|passcode|verify|auth|credential)"' Tweak.x \
               | grep -vE '^\s*[0-9]+:\s*//'; then
            echo "❌ 检测到「方法名子串筛选挂钩」（containsString:@\"unlock\" 之类）。"
            echo "   这会把签名不兼容的方法也挂上 → 通用转发读错参数 → SpringBoard 崩溃。"
            echo "   必须改为：显式白名单精确匹配 + method_copyArgumentType 签名校验。"
            FAIL=1
          fi
          if grep -qE 'DLReconSignatureOK|method_copyArgumentType' Tweak.x; then
            echo "✅ 通用转发挂钩已带签名校验（DLReconSignatureOK / method_copyArgumentType）"
          else
            if grep -qE 'DLReconV[0-3]|DLReconI[0-3]' Tweak.x; then
              echo "❌ 用了通用转发函数（DLReconV0..3 / I0..3）但没有签名校验 → 高概率崩溃"
              FAIL=1
            fi
          fi
          echo "--- 检查 6：通用转发函数体必须包 @try ---"
          if grep -qE 'static void DLReconV1' Tweak.x; then
            if grep -A 6 'static void DLReconV1' Tweak.x | grep -qE '@try|DLReconLog\('; then
              echo "✅ 转发函数走 DLReconLog（内部已包 @try）"
            else
              echo "❌ 转发函数体未见 @try 保护 → 一次异常就是 SpringBoard 挂"
              FAIL=1
            fi
          fi

          echo "--- 检查 7：原 IMP 查表不能用 [self class]（KVO 动态子类会拿到假类名） ---"
          if grep -nE 'NSStringFromClass\(\[self class\]\)' Tweak.x \
               | grep -vE '^\s*[0-9]+:\s*//'; then
            echo "❌ 原 IMP 查表用了 [self class]。KVO 场景下会返回被观察前的类名 → 查表查空。"
            echo "   改用 object_getClass(self)，并沿继承链向上找（上限 24 层防环）。"
            FAIL=1
          fi

          echo "--- 检查 8：⭐ v0.1.14 主动取词必须真的接上（防「等着系统回调」反模式复活） ---"
          # 本项目 v0.1.0~v0.1.13 共 13 个版本都栽在同一个坑里：
          #   「输入完 → 等系统调用某个带密码的方法 → 在那里比对」
          # v0.1.13 日志实锤：系统在密码错误路径上**不外露任何携带密码的调用**
          #   （unlockWithRequest: 被调用 0 次），这条路永远走不通。
          # 唯一可行的是【主动取词】：输入够位数时插件自己去比对。
          # 下面这几条保证它不会被后来的改动悄悄破坏。
          if ! grep -qE 'DLTriggerActiveVerdict' Tweak.x; then
            echo "❌ 没有找到 DLTriggerActiveVerdict ——「主动取词」入口消失了。"
            echo "   这个插件必须*主动*判定（不等系统回调），否则又回到 13 版都没解决的死路上。"
            FAIL=1
          fi
          if grep -qE 'DLTriggerActiveVerdict' Tweak.x; then
            if ! grep -qE 'DLTriggerActiveVerdict\(gDLLastSrc\)' Tweak.x; then
              echo "❌ DLTriggerActiveVerdict 定义了但没在输入钩子里调用 → 主动判定永远不触发"
              FAIL=1
            fi
          fi
          if ! grep -qE 'handleCapturedPasscode' DLDecoyController.m; then
            echo "❌ DLDecoyController 没实现 handleCapturedPasscode:（主动判定的核心比对函数）"
            FAIL=1
          fi
          if ! grep -qE 'DLTriggerActiveVerdict' Tweak.x; then
            : # 上面已报
          else
            # 输入钩子里必须真的调到（Hook 组 A 的 appendString:/setText:）
            if ! grep -A 12 'DLAppendInput(NSString \*text' Tweak.x | grep -qE 'DLTriggerActiveVerdict'; then
              echo "❌ DLAppendInput 函数体里没调 DLTriggerActiveVerdict → 主动判定接不上输入"
              FAIL=1
            fi
            echo "✅ 主动取词链路完整（输入钩子 → DLTriggerActiveVerdict → handleCapturedPasscode:）"
          fi

          echo "--- 检查 9：⭐ v0.1.18a 格式串里的字面 % 必须写成 %% ---"
          # 教训（v0.1.17 / v0.1.18 连续两轮 CI 挂掉的根因之一）：
          #   DLProbe 声明为 NS_FORMAT_FUNCTION(1,2) → 编译器按 printf 规则校验。
          #   日志文案 "避免 %orig 跳 NULL" 里的 %o 被当成「八进制占位符」，
          #   而后面没有参数 → error: more '%' conversions than data arguments。
          #   凡是日志里想写 %orig / %hook 这类 **Logos 字面量**，都要写 %%。
          python3 - <<'PY'
          import glob, re, sys
          files = ["Tweak.x", "DLDecoyController.m", "DLCommon.m"] + glob.glob("prefs/*.m")
          call = re.compile(r'(?:DLProbe|DLPrefsLog)\s*\(\s*@"((?:[^"\\]|\\.)*)"')
          # 合法的转换符：修饰符(l/ll/h/hh/z/q/j/t) + 转换字符
          conv = re.compile(r'%[-+ #0-9.*]*[lhqzjt]*[diouxXeEfgGaAcspn@]')
          bad = []
          for f in files:
              try:
                  src = open(f, encoding="utf-8").read()
              except FileNotFoundError:
                  continue
              for i, line in enumerate(src.splitlines(), 1):
                  m = call.search(line)
                  if not m:
                      continue
                  s = m.group(1)
                  # 先把合法的 %% 摘掉，避免误报
                  probe = s.replace("%%", "\x00")
                  # ① 合法转换符后面紧跟【两个以上 ASCII 字母】才算露馅。
                  #    单个字母不算：%.1fs 的 s 是「秒」单位；%u参 的「参」不是 ASCII
                  #    （Python 的 str.isalpha() 对中文也返回 True，必须显式 isascii()，
                  #      否则整片中文日志全是误报 —— 实测连报 3 处）。
                  for mm in conv.finditer(probe):
                      nxt = probe[mm.end():mm.end()+2]
                      if len(nxt) == 2 and all(c.isascii() and c.isalpha() for c in nxt):
                          bad.append((f, i, s))
                          break
                  else:
                      # ② 剩下还有未匹配的裸 %
                      rest = conv.sub("", probe)
                      if "%" in rest:
                          bad.append((f, i, s))
          if bad:
              print("❌ 以下日志格式串里的 %% 没转义（编译会报 -Wformat-insufficient-args）：")
              for f, i, s in bad:
                  print("   %s:%d  %s" % (f, i, s))
              print("   修法：把 %orig / %hook 这类字面量写成 %%orig / %%hook")
              sys.exit(1)
          print("✅ 日志格式串检查通过")
          PY
          if [ $? -ne 0 ]; then FAIL=1; fi

          echo "--- 检查 10：⭐ objc 运行时函数必须有可见声明（v0.1.17/v0.1.18 编译失败根因之二） ---"
          # 教训：DLDecoyController.m 用了 object_getClass，但 objc/runtime.h 当时
          #       **只在 Tweak.x 里导入过**。C 语言按翻译单元独立编译 → 该 .m 看不到声明 →
          #       4 连错：implicit declaration / conflicting types / deprecated-non-prototype。
          #       正解：统一在 DLCommon.h 里 #import <objc/runtime.h>，
          #       产物源文件只要 #import "DLCommon.h" 就自动拿到全部声明。
          RUNTIME_API='object_getClass|class_getInstanceMethod|class_getMethodImplementation|method_copyReturnType|method_copyArgumentType|method_getTypeEncoding|method_getImplementation|objc_getClassList|objc_copyClassList|class_addMethod|method_setImplementation|class_getName|class_getSuperclass|MSHookMessageEx'
          for f in Tweak.x DLDecoyController.m DLCommon.m; do
            [ -f "$f" ] || continue
            if grep -qE "$RUNTIME_API" "$f"; then
              if ! grep -qE 'objc/runtime\.h|"DLCommon\.h"' "$f"; then
                echo "❌ $f 用了 objc 运行时函数，但没有可见声明"
                echo "   修法：加一行 #import <objc/runtime.h>（或 #import \"DLCommon.h\"，它已统一导入）"
                FAIL=1
              fi
            fi
          done
          if [ "$FAIL" -eq 0 ]; then
            echo "✅ objc 运行时函数声明检查通过"
          fi

          echo "--- 检查 11：同一个类只能有一个 %hook 块（多个会互相覆盖） ---"
          DUP=$(grep -oE '^%hook[[:space:]]+[A-Za-z_][A-Za-z0-9_]*' Tweak.x | awk '{print $2}' | sort | uniq -d)
          if [ -n "$DUP" ]; then
            echo "❌ 以下类出现了多个 %hook 块（Logos 会以后者为准，前面的钩子静默失效）："
            echo "$DUP" | sed 's/^/   /'
            FAIL=1
          else
            echo "✅ 无重复 %hook 类"
          fi

          echo "--- 检查 12：⭐⭐ 自建窗口禁止 makeKeyAndVisible（2026-10-06 锁屏卡死事故） ---"
          # 事故复盘：用户反馈「正常输入密码界面点不动了」。
          #   根因 = 自建的高层级窗口调了 makeKeyAndVisible，**把系统锁屏的 key window
          #   抢走**；我们退出时只 hidden=YES，没把 key 还给系统 →
          #   锁屏收不到触摸（看得见界面，点不动）。
          #   正解：窗口要显示只需 hidden=NO + 层级够高，**根本不需要当 key window**。
          if grep -vE '^[[:space:]]*(//|\*|/\*)' DLDecoyController.m \
               | grep -nE 'makeKeyAndVisible'; then
            echo "❌ DLDecoyController.m 里出现了 makeKeyAndVisible —— 会抢走锁屏的 key window，"
            echo "   用户退出后密码界面会点不动。改用 win.hidden = NO;（见文件顶部三条铁律）"
            FAIL=1
          else
            echo "✅ 自建窗口未抢 key window"
          fi

          echo "--- 检查 13：⭐ 锁屏消失/解锁成功时必须拆窗口（防「残留挡板」回归） ---"
          # 自建窗口若在锁屏消失时没被拆掉，就会变成「看不见却挡触摸」的挡板。
          # 必须存在 DLSafeTeardownIfStale 且至少在两个锁屏生命周期回调里被调用。
          if ! grep -qE 'DLSafeTeardownIfStale' Tweak.x; then
            echo "❌ 没有 DLSafeTeardownIfStale —— 锁屏消失时不会清理自建窗口，用户会被挡板卡住"
            FAIL=1
          else
            N=$(grep -cE 'DLSafeTeardownIfStale\(' Tweak.x)
            if [ "$N" -lt 3 ]; then
              echo "❌ DLSafeTeardownIfStale 只被调用 $N 次（应覆盖 锁屏重建/锁屏消失/解锁成功 三处）"
              FAIL=1
            else
              echo "✅ 锁屏生命周期清理已接上（$N 处）"
            fi
          fi

          echo "--- 检查 14：⭐ 吞键（抑制系统提交）必须有保护阀 ---"
          # 吞键是**唯一**能让用户键盘失效的机制。一旦误触发（伪密码被设成真实密码等），
          # 用户就彻底解不开锁。必须有过频保护，宁可功能失效也不能锁死设备。
          if grep -qE 'gDLSuppressOrig[[:space:]]*=[[:space:]]*YES' Tweak.x \
             && ! grep -qE 'DLSafeToSuppress' Tweak.x; then
            echo "❌ 有吞键逻辑但没有 DLSafeToSuppress 保护阀 —— 存在把用户锁在设备外的风险"
            FAIL=1
          else
            echo "✅ 吞键有保护阀"
          fi

          echo "--- 检查 15：⭐ Root.plist 里的 action 必须在设置页类里真有实现 ---"
          # 2026-10-06 教训：设置项「点哪个 App 退出」连续两版点不动。
          #   排查时发现：Preferences 框架对「plist 写了 action、但方法名打错或忘了实现」
          #   **不会报任何错**，只是点了毫无反应 —— 纯静态看代码根本看不出来，
          #   只能靠用户一轮轮实测，代价极高。
          #   这条交叉校验把这类确定性错误挡在编译前。
          python3 - <<'PY' || FAIL=1
          import io, re, sys
          p = io.open('prefs/Resources/Root.plist', encoding='utf-8', errors='replace').read()
          m = io.open('prefs/DLRootListController.m', encoding='utf-8', errors='replace').read()
          actions = set(re.findall(r'"action"\s*:\s*"([^"]+)"', p))
          code = re.sub(r'//[^\n]*', '', m)
          methods = set(re.findall(r'^\s*-\s*\([^)]*\)\s*([A-Za-z_][A-Za-z0-9_]*)', code, re.M))
          bad = [a for a in sorted(actions) if a.split(':')[0] not in methods]
          if bad:
              print("❌ Root.plist 里这些 action 在 DLRootListController.m 里没有实现：")
              for a in bad:
                  print("     - %s" % a)
              sys.exit(1)
          print("✅ plist 的 action 全部有实现（%d 个）" % len(actions))
          PY

          echo "--- 检查 16：⭐ 提交点 attemptUnlockWithPasscode: 必须真的拦截，不能只打日志就放行 ---"
          # 2026-10-06 用户实测：「按假密码，按完最后一位数字，还是要刷脸才能进假空间」。
          #   根因 = 这个钩子（系统把密码送去校验的地方）只打了行日志就 %orig 放行，
          #   我们在按键层吞掉一位并不能拦住所有输入路径 → 系统照常拿到完整伪密码
          #   → 判错 → 弹刷脸。正解是命中伪密码时**提前 return，不调 %orig**。
          python3 - <<'PY' || FAIL=1
          import io, re, sys
          t = io.open('Tweak.x', encoding='utf-8', errors='replace').read()
          m = re.search(r'- \(void\)attemptUnlockWithPasscode:.*?\n\}', t, re.S)
          if not m:
              print("❌ Tweak.x 里找不到 attemptUnlockWithPasscode: 钩子")
              sys.exit(1)
          code = re.sub(r'//[^\n]*', '', m.group(0))
          if 'DLDecoyPasscode()' not in code or '%orig' not in code:
              print("❌ 提交点钩子里缺少伪密码比对或 %orig（写法异常）")
              sys.exit(1)
          if not re.search(r'isEqualToString:DLDecoyPasscode\(\).*?return;', code, re.S):
              print("❌ 提交点没有「命中伪密码 → 提前 return（不 %orig）」")
              print("   → 系统仍会校验伪密码 → 判错 → 弹刷脸（用户已实测两轮）")
              sys.exit(1)
          print("✅ 提交点已真正拦截伪密码（不刷脸的关键）")
          PY

          echo "--- 检查 17：⭐⭐ Face ID 暂停必须有配套恢复（漏掉＝把用户 Face ID 永久关死） ---"
          # 2026-10-06 用户日志实锤：输伪密码后假空间铺上去了、系统也没判错，
          #   但真机最后仍被解开（退出后 [退出清理] 未找到密码框）—— 是 Face ID 干的。
          #   → v0.1.22 在「假空间展示期间」暂停 SBUIBiometricResource 的匹配。
          #   ⚠️ 这里最大的风险不是「关不掉」，而是「关了没人恢复」：
          #      用户 Face ID 会一直失效到下次重启桌面，属严重事故。
          #   所以本检查强制三件事同时存在：
          #     (a) 暂停调用确实存在；
          #     (b) 至少 2 个恢复点（用户主动退出 / 锁屏生命周期结束）+ 兜底守护；
          #     (c) 实现层必须 respondsToSelector 保护（不同 iOS 版本类名/方法可能不同）。
          python3 - <<'PY' || FAIL=1
          import io, re, sys

          common_m = io.open('DLCommon.m', encoding='utf-8', errors='replace').read()
          common_h = io.open('DLCommon.h', encoding='utf-8', errors='replace').read()
          ctl = io.open('DLDecoyController.m', encoding='utf-8', errors='replace').read()
          ctl_nc = re.sub(r'//[^\n]*', '', ctl)

